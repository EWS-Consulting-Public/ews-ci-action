ci:
  autoupdate_commit_msg: "chore: update pre-commit hooks"
  autofix_commit_msg: "style: pre-commit fixes"

# Two trees are deliberately exempt from the whitespace fixers:
#
#   .github/  is the product. Its YAML is what consumers execute; it is not
#             reformatted as a side effect of a docs change. Change it on
#             purpose or not at all.
#   docs/_old/ is parked evidence of what the docs said before 2026-08-07.
#             Its value is being verbatim - and its trailing double-spaces are
#             markdown hard line breaks, so "fixing" them alters rendering.
#
# check-yaml still covers .github/: validating it is the point, and it never
# rewrites a file.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      # Everything this repo ships is YAML - a parse error here breaks every
      # consuming repository's CI at once, and nothing else checks it.
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: ^(\.github/|docs/_old/)
      - id: mixed-line-ending
        exclude: ^docs/_old/
        # Default is --fix=auto, which keeps whatever already dominates a file.
        # .gitattributes forces LF; this makes the hook agree with it. It also
        # matters more here than usual: these files are executed by bash on
        # ubuntu runners, where a stray CR is a syntax error.
        args: [--fix=lf]
      - id: trailing-whitespace
        exclude: ^(\.github/|docs/_old/)

  # .claude/ is generated from .cursor/ - fail if it drifts (rule agent-config-sync).
  # --no-project: this repo has no pyproject.toml. The script is stdlib-only.
  - repo: local
    hooks:
      - id: sync-agent-config
        name: agent config (.claude generated from .cursor)
        entry: uv run --no-project python scripts/sync_agent_config.py --check
        language: system
        files: ^\.(cursor|claude)/|^scripts/sync_agent_config\.py$
        pass_filenames: false
