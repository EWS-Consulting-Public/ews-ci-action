name: CI

on:
  workflow_call:
    inputs:
      python-versions:
        description: JSON array of Python versions to test (e.g. '["3.12", "3.13"]')
        type: string
        required: false
        default: '["3.12"]'
      lint-python-version:
        description: Python version for lint job
        type: string
        required: false
        default: "3.12"
      run-lint:
        description: Run linting checks
        type: boolean
        required: false
        default: true
      run-tests:
        description: Run tests
        type: boolean
        required: false
        default: true
      run-coverage:
        description: Run coverage
        type: boolean
        required: false
        default: true
      upload-coverage:
        description: Upload coverage to Codecov
        type: boolean
        required: false
        default: false
      run-build:
        description: Build package
        type: boolean
        required: false
        default: true
      use-nox-build:
        description: Use 'uvx nox -s build' instead of 'uv build'
        type: boolean
        required: false
        default: true
      upload-artifacts:
        description: Upload build artifacts
        type: boolean
        required: false
        default: true
      pytest-args:
        description: 'Additional arguments for pytest (e.g. ''-m "not fails_in_ci"'' or ''-k test_something''). Empty by default (runs all tests).'
        type: string
        required: false
        default: ""
      ews-credentials-keys:
        description: "Repository variable EWS_CREDENTIALS_KEYS - JSON array of the keys EWS_CREDENTIALS must carry; setup fails naming any that are missing (optional)"
        type: string
        required: false
        default: ""
      data-plan:
        description: "Path of a data plan (config/plans/<name>.yaml) whose committed lock keys a cache of the data root; the test job restores it, runs 'ews-gcp plan-ensure', and saves on a miss. Empty: no data step. Needs ews-gcp-utils among the package's dependencies and a gcp_default_key in EWS_CREDENTIALS."
        type: string
        required: false
        default: ""
    secrets:
      EWS_CREDENTIALS:
        description: "JSON object with all EWS credentials, as written by 'ews-github configure'; every key is exported to the job as UPPER(key)"
        required: false

jobs:
  check-skip:
    runs-on: ubuntu-latest
    outputs:
      should-skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Check if should skip
        id: check
        env:
          # Use env (not inline ${{ }}) so backticks, $(), etc. in commit messages
          # are not interpreted by bash.
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          COMMIT_MSG_LOWER=$(echo "$COMMIT_MSG" | tr '[:upper:]' '[:lower:]')

          # Skip if commit message contains [skip ci] or [ci skip]
          if [[ "$COMMIT_MSG_LOWER" == *"[skip ci]"* ]] || \
             [[ "$COMMIT_MSG_LOWER" == *"[ci skip]"* ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⏭️ Skipping CI: [skip ci] or [ci skip] in commit message"
            exit 0
          fi

          # Skip CI on main branch if commit is a version bump (tag CI will run instead)
          COMMIT_MSG_FIRST_LINE=$(echo "$COMMIT_MSG" | head -n 1)
          if [[ "${{ github.ref }}" == "refs/heads/main" ]] && \
             [[ "$COMMIT_MSG_FIRST_LINE" == "bump version to"* ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⏭️ Skipping CI for version bump commit (will run on tag)"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    needs: check-skip
    if: needs.check-skip.outputs.should-skip != 'true' && inputs.run-lint
    steps:
      - uses: actions/checkout@v4

      - uses: EWS-Consulting-Public/ews-ci-action/.github/actions/setup-ews-ci@v1
        with:
          python-version: ${{ inputs.lint-python-version }}
          install-dependencies: "false"
          ews-credentials: ${{ secrets.EWS_CREDENTIALS }}
          ews-credentials-keys: ${{ inputs.ews-credentials-keys }}

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: check-skip
    if: needs.check-skip.outputs.should-skip != 'true' && inputs.run-tests
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    steps:
      - uses: actions/checkout@v4

      - uses: EWS-Consulting-Public/ews-ci-action/.github/actions/setup-ews-ci@v1
        with:
          python-version: ${{ matrix.python-version }}
          install-dependencies: "true"
          ews-credentials: ${{ secrets.EWS_CREDENTIALS }}
          ews-credentials-keys: ${{ inputs.ews-credentials-keys }}

      # The data plan, when the caller names one: the cache is the data root
      # the composite action exported (EWS_DATA_ROOT), keyed on the plan's
      # committed lock; plan-ensure always runs, so a stale prefix restore is
      # repaired rather than trusted, and the save happens before the tests
      # so a red test still leaves a warm cache.
      - name: Resolve the data plan
        if: inputs.data-plan != ''
        id: data-plan
        env:
          # Through env, not interpolated: the value is a path a consumer wrote.
          DATA_PLAN: ${{ inputs.data-plan }}
        run: |
          set -euo pipefail
          if [ ! -f "${DATA_PLAN}" ]; then
            echo "::error::data-plan '${DATA_PLAN}' is not a file in the checkout"
            exit 1
          fi
          LOCK="${DATA_PLAN%.*}.lock.json"
          if [ ! -f "${LOCK}" ]; then
            echo "::error::no lock beside the plan (expected ${LOCK}). Write and commit it: uv run ews-gcp plan-lock ${DATA_PLAN}"
            exit 1
          fi
          KEY="ews-data-${RUNNER_OS}-$(sha256sum "${LOCK}" | cut -c1-16)"
          echo "lock=${LOCK}" >> "${GITHUB_OUTPUT}"
          echo "key=${KEY}" >> "${GITHUB_OUTPUT}"
          echo "plan ${DATA_PLAN} -> lock ${LOCK} -> cache key ${KEY}"

      - name: Restore the data root from the cache
        if: inputs.data-plan != ''
        id: data-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ews-data
          key: ${{ steps.data-plan.outputs.key }}
          restore-keys: |
            ews-data-${{ runner.os }}-

      - name: Fetch what the cache did not have
        if: inputs.data-plan != ''
        env:
          DATA_PLAN: ${{ inputs.data-plan }}
          CACHE_HIT: ${{ steps.data-cache.outputs.cache-hit }}
          CACHE_KEY: ${{ steps.data-plan.outputs.key }}
        run: |
          set -euo pipefail
          SECONDS=0
          uv run ews-gcp plan-ensure "${DATA_PLAN}"
          if [ "${CACHE_HIT}" = "true" ]; then outcome="hit"; else outcome="miss"; fi
          echo "⏱️  plan-ensure took ${SECONDS}s after a cache ${outcome} on ${CACHE_KEY}"
          {
            echo "### Data plan ${DATA_PLAN}"
            echo ""
            echo "| cache | key | plan-ensure |"
            echo "| --- | --- | --- |"
            echo "| ${outcome} | ${CACHE_KEY} | ${SECONDS} s |"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Save the data root to the cache
        if: inputs.data-plan != '' && steps.data-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ews-data
          key: ${{ steps.data-plan.outputs.key }}

      - name: Run tests
        if: ${{ !inputs.run-coverage }}
        run: uv run pytest ${{ inputs.pytest-args }}

      - name: Run tests with coverage
        if: ${{ inputs.run-coverage }}
        run: uv run pytest ${{ inputs.pytest-args }} --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        if: inputs.run-coverage && inputs.upload-coverage && matrix.python-version == fromJSON(inputs.python-versions)[0]
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: [check-skip, lint, test]
    if: needs.check-skip.outputs.should-skip != 'true' && inputs.run-build
    steps:
      - uses: actions/checkout@v4

      - uses: EWS-Consulting-Public/ews-ci-action/.github/actions/setup-ews-ci@v1
        with:
          python-version: ${{ inputs.lint-python-version }}
          install-dependencies: "true"
          ews-credentials: ${{ secrets.EWS_CREDENTIALS }}
          ews-credentials-keys: ${{ inputs.ews-credentials-keys }}

      - name: Build package (nox)
        if: ${{ inputs.use-nox-build }}
        run: uvx nox -s build

      - name: Build package (uv)
        if: ${{ !inputs.use-nox-build }}
        run: uv build --wheel

      - name: Upload build artifacts
        if: inputs.upload-artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
