# End-to-end workflow - a caller with the three triggers
#
# Delete the triggers you do not want, and the matching line of the job's `if:`.
# The commit message is read only inside `if:`, never in a shell. A commit that
# also carries `[skip ci]` starts nothing. The release line keys on the event
# the release workflow keys on, a green CI run on a `v` tag: it runs beside the
# release, from the tag's checkout, not after the wheel is published. Never key
# it on the release workflow: a run started by `workflow_run` runs on the
# default branch, so its `head_branch` is never the tag.

name: End-to-end

on:
  workflow_dispatch:
  push:
    branches: [main]
  workflow_run:
    workflows: ["CI"] # your CI workflow's `name:`
    types: [completed]

jobs:
  e2e:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[e2e]')) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
        startsWith(github.event.workflow_run.head_branch, 'v'))
    uses: EWS-Consulting-Public/ews-ci-action/.github/workflows/e2e.yml@v1
    with:
      command: uv run <your-cli> <your-end-to-end-command>
      ref: ${{ github.event.workflow_run.head_branch }} # the tag on a release run, empty otherwise
    secrets:
      EWS_CREDENTIALS: ${{ secrets.EWS_CREDENTIALS }}
      EWS_GCP__DEFAULT_KEY: ${{ secrets.EWS_GCP__DEFAULT_KEY }}
      EWS_GCP__PROJECT: ${{ secrets.EWS_GCP__PROJECT }}
