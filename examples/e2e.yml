# End-to-end workflow - a caller with the three triggers
#
# Delete the triggers you do not want, and the matching line of the job's `if:`.
# The commit message is read only inside `if:`, never in a shell. A commit that
# also carries `[skip ci]` starts nothing. The after-release line does not fire
# as written: a release run started by `workflow_run` reports the default
# branch as its `head_branch`, not the tag (docs/README.md § Open questions).

name: End-to-end

on:
  workflow_dispatch:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Release to GitLab"] # your release workflow's `name:`
    types: [completed]

jobs:
  e2e:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[e2e]')) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
        startsWith(github.event.workflow_run.head_branch, 'v'))
    uses: EWS-Consulting-Public/ews-ci-action/.github/workflows/e2e.yml@v1
    with:
      command: uv run <your-cli> <your-end-to-end-command>
      ref: ${{ github.event.workflow_run.head_branch }}
    secrets:
      EWS_CREDENTIALS: ${{ secrets.EWS_CREDENTIALS }}
      EWS_GCP__DEFAULT_KEY: ${{ secrets.EWS_GCP__DEFAULT_KEY }}
      EWS_GCP__PROJECT: ${{ secrets.EWS_GCP__PROJECT }}
