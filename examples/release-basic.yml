# Release Workflow - Basic Package
#
# docs/adopting.md § 2 is the recommended caller. It keeps this file's
# `branches: ['v*']` filter, forwards EWS_CREDENTIALS by name, since GitHub
# honours `secrets: inherit` only from the same organization or enterprise as
# this action, and sets `contents: write` and `actions: read`, which this file
# does not.

name: Release to GitLab

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - 'v*'

jobs:
  release:
    uses: EWS-Consulting-Public/ews-ci-action/.github/workflows/release.yml@v1
    with:
      python-version: "3.12"
      use-nox-publish: true  # Use nox for publishing
    secrets: inherit
