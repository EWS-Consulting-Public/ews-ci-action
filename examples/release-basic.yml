# Release Workflow - Basic Package
#
# The caller docs/adopting.md § 2 recommends. EWS_CREDENTIALS is forwarded by
# name: GitHub honours `secrets: inherit` only from the same organization or
# enterprise as this action.

name: Release to GitLab

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - 'v*'

permissions:
  contents: write # create the GitHub release
  actions: read # read the triggering workflow run

jobs:
  release:
    uses: EWS-Consulting-Public/ews-ci-action/.github/workflows/release.yml@v1
    with:
      python-version: "3.12"
      use-nox-publish: true  # Use nox for publishing
    secrets:
      EWS_CREDENTIALS: ${{ secrets.EWS_CREDENTIALS }}
