# Release Workflow - with an end-to-end step
#
# After the wheel and the GitHub release are published, the reusable workflow
# runs `e2e-command` with the two overlay secrets in its environment. A secret
# you do not pass is unset, not exported empty.

name: Release to GitLab

on:
  workflow_run:
    workflows: ["CI"] # must match the CI workflow's `name:`
    types: [completed]

permissions:
  contents: write # create the GitHub release
  actions: read # read the triggering workflow run

jobs:
  release:
    uses: EWS-Consulting-Public/ews-ci-action/.github/workflows/release.yml@v1
    with:
      e2e-command: uv run <your-cli> <your-end-to-end-command>
    secrets:
      EWS_CREDENTIALS: ${{ secrets.EWS_CREDENTIALS }}
      EWS_GCP__DEFAULT_KEY: ${{ secrets.EWS_GCP__DEFAULT_KEY }}
      EWS_GCP__PROJECT: ${{ secrets.EWS_GCP__PROJECT }}
