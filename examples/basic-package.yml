# CI Workflow - Basic Package

name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

jobs:
  ci:
    uses: EWS-Consulting-Public/ews-ci-action/.github/workflows/ci.yml@v1
    with:
      python-versions: '["3.12", "3.13"]'  # Matrix testing
      lint-python-version: "3.12"
      run-coverage: true  # Collect coverage; add upload-coverage: true to send it to Codecov
      use-nox-build: true  # Use nox for build
    secrets:
      EWS_CREDENTIALS: ${{ secrets.EWS_CREDENTIALS }}
